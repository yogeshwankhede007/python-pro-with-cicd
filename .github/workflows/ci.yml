# =============================================================================
# CI PIPELINE - Continuous Integration
# =============================================================================
# This workflow runs on every push and pull request to ensure code quality.
#
# WHAT IS CI (Continuous Integration)?
# ------------------------------------
# CI is the practice of automatically building and testing code changes
# every time a developer pushes code to the repository. This helps:
# - Catch bugs early before they reach production
# - Ensure code quality standards are met
# - Provide fast feedback to developers
# - Maintain a stable codebase
#
# WORKFLOW STAGES:
# 1. Code Quality Checks (linting, formatting)
# 2. Security Scanning
# 3. Unit Testing (across multiple Python versions)
# 4. Code Coverage Analysis
# =============================================================================

name: CI Pipeline

# When does this workflow run?
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

# Environment variables used across jobs
env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  # ===========================================================================
  # JOB 1: Code Quality Checks
  # ===========================================================================
  # This job ensures code follows our style guidelines and best practices.
  # It runs linters and formatters to catch issues early.
  # ===========================================================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      # This downloads your repository code to the runner
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      # This installs Python on the runner
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'  # Cache pip dependencies for faster builds

      # Step 3: Install dependencies
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Step 4: Check code formatting with Black
      # Black is an opinionated code formatter
      - name: 🎨 Check formatting (Black)
        run: |
          echo "Checking code formatting with Black..."
          black --check --diff src/ tests/

      # Step 5: Check import sorting with isort
      # isort organizes imports in a consistent manner
      - name: 📑 Check import sorting (isort)
        run: |
          echo "Checking import sorting with isort..."
          isort --check-only --diff src/ tests/

      # Step 6: Lint code with flake8
      # flake8 checks for code style and potential errors
      - name: 🔎 Lint code (flake8)
        run: |
          echo "Linting code with flake8..."
          flake8 src/ tests/ --count --statistics

      # Step 7: Type checking with mypy
      # mypy checks for type errors in your code
      - name: 🔤 Type check (mypy)
        run: |
          echo "Type checking with mypy..."
          mypy src/ --ignore-missing-imports

  # ===========================================================================
  # JOB 2: Security Scanning
  # ===========================================================================
  # This job scans the code for security vulnerabilities.
  # Security is crucial in any software project!
  # ===========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      # Bandit scans Python code for common security issues
      - name: 🛡️ Run Bandit security scan
        run: |
          echo "Scanning code for security issues..."
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt

      # Safety checks dependencies for known vulnerabilities
      - name: 🔐 Check dependencies (Safety)
        run: |
          echo "Checking dependencies for vulnerabilities..."
          pip freeze > requirements-frozen.txt
          safety check -r requirements-frozen.txt --full-report || true
        continue-on-error: true  # Don't fail the build for dependency warnings

  # ===========================================================================
  # JOB 3: Unit Testing
  # ===========================================================================
  # JOB 3: Unit Testing
  # ===========================================================================
  # This job runs our test suite with Python 3.11.
  # ===========================================================================
  test:
    name: 🧪 Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # Run tests with pytest and generate coverage report
      - name: 🧪 Run tests with pytest
        run: |
          echo "Running test suite..."
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing

      # Upload coverage report as artifact
      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ===========================================================================
  # JOB 4: Coverage Analysis
  # ===========================================================================
  # This job analyzes test coverage and can upload to coverage services.
  # Needs the test job to complete first.
  # ===========================================================================
  coverage:
    name: 📈 Coverage Analysis
    runs-on: ubuntu-latest
    needs: test  # This job depends on the test job

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      # Optional: Upload to Codecov (uncomment if you have Codecov set up)
      # - name: 📤 Upload to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-umbrella

      - name: 📊 Display coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully!" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # JOB 5: Build Package
  # ===========================================================================
  # This job builds the Python package to ensure it can be packaged correctly.
  # ===========================================================================
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: [code-quality, test]  # Only build if quality checks and tests pass

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 🏗️ Build package
        run: |
          echo "Building package..."
          python -m build

      - name: 🔍 Check package
        run: |
          echo "Checking package with twine..."
          twine check dist/*

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
