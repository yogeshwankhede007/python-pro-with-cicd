# =============================================================================
# PULL REQUEST WORKFLOW
# =============================================================================
# This workflow runs specifically on pull requests to provide feedback
# before code is merged.
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  # ===========================================================================
  # PR Size Check
  # ===========================================================================
  pr-size:
    name: 📏 PR Size Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📏 Check PR size
        run: |
          # Count lines changed
          ADDITIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | awk '{print $4}' || echo "0")
          DELETIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | awk '{print $6}' || echo "0")
          TOTAL=$((${ADDITIONS:-0} + ${DELETIONS:-0}))
          
          echo "## 📏 PR Size Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Additions: +${ADDITIONS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- Deletions: -${DELETIONS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- Total changes: ${TOTAL}" >> $GITHUB_STEP_SUMMARY
          
          if [ "$TOTAL" -gt 500 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning**: This PR is quite large. Consider breaking it into smaller PRs for easier review." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Code Review Automation
  # ===========================================================================
  code-review:
    name: 🔍 Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🎨 Format check
        id: format
        run: |
          black --check --diff src/ tests/ 2>&1 | head -50 || echo "format_issues=true" >> $GITHUB_OUTPUT

      - name: 📑 Import check
        id: imports
        run: |
          isort --check-only --diff src/ tests/ 2>&1 | head -50 || echo "import_issues=true" >> $GITHUB_OUTPUT

      - name: 🔎 Lint check
        id: lint
        run: |
          flake8 src/ tests/ --count --statistics || echo "lint_issues=true" >> $GITHUB_OUTPUT

      - name: 📝 Summary
        run: |
          echo "## 🔍 Code Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.format.outputs.format_issues }}" == "true" ]; then
            echo "- ❌ **Formatting**: Issues found. Run \`black src/ tests/\` to fix." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **Formatting**: All good!" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.imports.outputs.import_issues }}" == "true" ]; then
            echo "- ❌ **Imports**: Issues found. Run \`isort src/ tests/\` to fix." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **Imports**: All good!" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.lint.outputs.lint_issues }}" == "true" ]; then
            echo "- ⚠️ **Linting**: Issues found. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **Linting**: All good!" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Test Coverage Comparison
  # ===========================================================================
  coverage-check:
    name: 📊 Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: 🧪 Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: 📊 Coverage Summary
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(f\"{float(tree.getroot().attrib['line-rate'])*100:.1f}\")")
          
          echo "## 📊 Test Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "⚠️ Coverage is below 80%. Please add more tests." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Coverage meets the 80% threshold!" >> $GITHUB_STEP_SUMMARY
          fi
